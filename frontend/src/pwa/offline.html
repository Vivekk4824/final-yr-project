<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#244e3d"><title>VendorMap · Connection needed</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:#f6f5ef;color:#203b30;font-family:"Segoe UI","Nirmala UI",system-ui,sans-serif}main{width:100%;max-width:420px}svg{width:52px;height:52px}h1{font-size:30px;letter-spacing:-1px;line-height:1.25;margin:26px 0 14px}p{color:#646c62;line-height:1.8;font-size:16px}button{margin-top:16px;background:#244e3d;color:#fffefa;border:0;border-radius:12px;min-height:48px;padding:12px 20px;font:inherit;font-size:16px;font-weight:600;cursor:pointer}button:focus-visible{outline:3px solid #bd653c;outline-offset:4px}</style></head>
<body><main>__VM_LOGO__<h1 id="title">Connection needed</h1><p id="message">Reconnect to view current places, applications and allocation information. Private information is not available offline.</p><button id="retry" type="button">Try again</button></main>
<script>const text={en:["Connection needed","Reconnect to view current places, applications and allocation information. Private information is not available offline.","Try again"],mr:["इंटरनेट जोडणी आवश्यक","सध्याच्या जागा, अर्ज आणि वाटपाची माहिती पाहण्यासाठी पुन्हा इंटरनेटशी जोडा. खाजगी माहिती ऑफलाइन उपलब्ध नाही.","पुन्हा प्रयत्न करा"],hi:["इंटरनेट कनेक्शन ज़रूरी है","वर्तमान जगहों, आवेदनों और आवंटन की जानकारी देखने के लिए फिर से कनेक्ट करें. निजी जानकारी ऑफलाइन उपलब्ध नहीं है.","फिर कोशिश करें"]};let lang="en";try{lang=localStorage.getItem("nmc_vendor_language")||"en"}catch{}if(!text[lang])lang="en";document.documentElement.lang=lang;document.getElementById("title").textContent=text[lang][0];document.getElementById("message").textContent=text[lang][1];document.getElementById("retry").textContent=text[lang][2];document.getElementById("retry").onclick=()=>location.reload();addEventListener("online",()=>location.reload());</script></body></html>
